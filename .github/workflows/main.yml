
name: NetworkSecurity CI-CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Lint Code
        run: |
          echo "Linting repository"

      - name: Run Unit Tests
        run: |
          echo "Running unit tests"

  # ==========================================
  # 2. CONTINUOUS DELIVERY
  # ==========================================
  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    outputs:
       registry: ${{ steps.login-ecr.outputs.registry }}
       image_uri: ${{ steps.build-image.outputs.image_uri }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Validate ECR Configuration
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          set -euo pipefail

          : "${ECR_REGISTRY:?ECR registry is empty}"
          : "${ECR_REPOSITORY:?ECR repository secret is missing}"

          echo "ECR Registry: $ECR_REGISTRY"
          echo "ECR Repository: $ECR_REPOSITORY"

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "${{ secrets.AWS_REGION }}"

      - name: Build and Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${ECR_REGISTRY:?Registry is empty}"
          : "${ECR_REPOSITORY:?Repository is empty}"
          : "${IMAGE_TAG:?Image tag is empty}"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          LATEST_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "Building Docker image: $IMAGE_URI"

          docker build \
            -t "$IMAGE_URI" \
            -t "$LATEST_URI" .

          echo "Pushing versioned image..."
          docker push "$IMAGE_URI"

          echo "Pushing latest image..."
          docker push "$LATEST_URI"

          # Export image as a step output
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          # Verify output generation
          : "${IMAGE_URI:?Docker image URI is empty}"

          echo "Successfully built and pushed: $IMAGE_URI"

      - name: Verify Build Outputs
        env:
          IMAGE: ${{ steps.build-image.outputs.image_uri }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          : "${IMAGE:?Build image output is empty}"
          : "${REGISTRY:?Registry output is empty}"

          echo "Build output: $IMAGE"
          echo "Registry output: $REGISTRY"

  # ==========================================
  # 3. CONTINUOUS DEPLOYMENT
  # ==========================================
  
  Continuous-Deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: self-hosted

    steps:
      - name: Validate Deployment Outputs
        env:
          IMAGE: ${{ needs.build-and-push-ecr-image.outputs.image_uri }}
          REGISTRY: ${{ needs.build-and-push-ecr-image.outputs.registry }}
        run: |
          set -euo pipefail

          : "${IMAGE:?Deployment image output is empty}"
          : "${REGISTRY:?ECR registry output is empty}"

          echo "Deployment image: $IMAGE"
          echo "ECR Registry: $REGISTRY"

          case "$IMAGE" in
            "$REGISTRY"/*:*) ;;
            *)
              echo "Invalid image reference: $IMAGE"
              exit 1
              ;;
          esac

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Pull Docker Image
        env:
          IMAGE: ${{ needs.build-and-push-ecr-image.outputs.image_uri }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

      - name: Stop Existing Container
        run: |
          docker rm -f network_security || true

      - name: Run New Docker Container
        env:
          IMAGE: ${{ needs.build-and-push-ecr-image.outputs.image_uri }}
        run: |
          set -euo pipefail

          docker run -d \
            --restart unless-stopped \
            -p 8080:8080 \
            --ipc=host \
            --name network_security \
            "$IMAGE"

      - name: Verify Container
        run: |
          set -euo pipefail
          sleep 5

          if [ "$(docker inspect -f '{{.State.Running}}' network_security)" != "true" ]; then
            echo "Container failed to start"
            docker logs network_security
            exit 1
          fi

          echo "Container started successfully"
          docker ps --filter "name=network_security"
          docker logs --tail 50 network_security

      - name: Clean Unused Docker Images
        run: docker image prune -f
