name: NetworkSecurity CI-CD pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Lint Code
        run: |
          echo "Linting repository"

      - name: Run Unit Tests
        run: |
          echo "Running unit tests"

  # ==========================================
  # 2. CONTINUOUS DELIVERY
  # ==========================================
  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Validate ECR Configuration
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          : "${ECR_REGISTRY:?ECR registry is empty}"
          : "${ECR_REPOSITORY:?ECR repository secret is missing}"
          : "${AWS_REGION:?AWS region is missing}"

          echo "ECR Registry: $ECR_REGISTRY"
          echo "ECR Repository: $ECR_REPOSITORY"

          aws ecr describe-repositories             --repository-names "$ECR_REPOSITORY"             --region "$AWS_REGION"

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${ECR_REGISTRY:?Registry is empty}"
          : "${ECR_REPOSITORY:?Repository is empty}"
          : "${IMAGE_TAG:?Image tag is empty}"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          LATEST_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "Building Docker image: $IMAGE_URI"

          docker build             -t "$IMAGE_URI"             -t "$LATEST_URI" .

          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

          echo "Docker image successfully pushed to ECR."

  # ==========================================
  # 3. CONTINUOUS DEPLOYMENT
  # ==========================================
  Continuous-Deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: self-hosted

    steps:

      # ==========================================
      # VERIFY AWS CLI
      # ==========================================
      - name: Verify AWS CLI
        run: |
          set -euo pipefail

          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

          command -v aws
          aws --version

      # ==========================================
      # CONFIGURE AWS CREDENTIALS
      # ==========================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ==========================================
      # GENERATE ECR IMAGE URI
      # ==========================================
      - name: Generate ECR Image URI
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${AWS_REGION:?AWS region is missing}"
          : "${ECR_REPOSITORY:?ECR repository is missing}"
          : "${IMAGE_TAG:?IMAGE tag is missing}"

          REPOSITORY_URI=$(aws ecr describe-repositories             --repository-names "$ECR_REPOSITORY"             --region "$AWS_REGION"             --query 'repositories[0].repositoryUri'             --output text)

          IMAGE="${REPOSITORY_URI}:${IMAGE_TAG}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "Image URI generated successfully."

      # ==========================================
      # LOGIN TO AMAZON ECR
      # ==========================================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      # ==========================================
      # PULL DOCKER IMAGE
      # ==========================================
      - name: Pull Docker Image
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

      # ==========================================
      # VALIDATE APPLICATION SECRETS
      # ==========================================
      - name: Validate Application Secrets
        env:
          MONGODB_URL_KEY: ${{ secrets.MONGODB_URL_KEY }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          set -euo pipefail

          : "${MONGODB_URL_KEY:?MongoDB URL is missing}"
          : "${MLFLOW_TRACKING_URI:?MLflow URI is missing}"
          : "${MLFLOW_TRACKING_USERNAME:?MLflow username is missing}"
          : "${MLFLOW_TRACKING_PASSWORD:?MLflow password is missing}"

          echo "All required application secrets are configured."

      # ==========================================
      # DEPLOY NEW CONTAINER
      # ==========================================
      - name: Run New Docker Container
        env:
          MONGODB_URL_KEY: ${{ secrets.MONGODB_URL_KEY }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          set -euo pipefail

          : "${MONGODB_URL_KEY:?MongoDB URL is missing}"
          : "${MLFLOW_TRACKING_URI:?MLflow URI is missing}"
          : "${MLFLOW_TRACKING_USERNAME:?MLflow username is missing}"
          : "${MLFLOW_TRACKING_PASSWORD:?MLflow password is missing}"

          # Preserve the previous container for rollback.
          docker rm -f network_security_previous 2>/dev/null || true

          if docker ps -a --format '{{.Names}}' | grep -qx network_security; then
            docker rename network_security network_security_previous
          fi

          # Start new application.
          if ! docker run -d             --restart unless-stopped             -p 8080:8080             --ipc=host             --name network_security             -e MONGODB_URL_KEY             -e MLFLOW_TRACKING_URI             -e MLFLOW_TRACKING_USERNAME             -e MLFLOW_TRACKING_PASSWORD             "$IMAGE"; then

            echo "New container failed to start."

            docker rm -f network_security 2>/dev/null || true

            if docker ps -a --format '{{.Names}}' | grep -qx network_security_previous; then
              docker rename network_security_previous network_security
              docker start network_security
            fi

            exit 1
          fi

      # ==========================================
      # VERIFY APPLICATION HEALTH
      # ==========================================
      - name: Verify Container
        run: |
          set -euo pipefail

          echo "Waiting for FastAPI application..."

          HEALTHY=false

          for i in {1..12}; do

            if curl -fsS http://127.0.0.1:8080/docs > /dev/null; then
              HEALTHY=true
              break
            fi

            sleep 5
          done

          if [ "$HEALTHY" != "true" ]; then

            echo "New application failed health check."

            docker logs --tail 100 network_security

            docker rm -f network_security || true

            if docker ps -a --format '{{.Names}}' | grep -qx network_security_previous; then
              docker rename network_security_previous network_security
              docker start network_security
              echo "Previous application restored."
            fi

            exit 1
          fi

          echo "FastAPI application is healthy."

          docker ps --filter "name=network_security"

      # ==========================================
      # REMOVE PREVIOUS CONTAINER
      # ==========================================
      - name: Remove Previous Container
        run: |
          docker rm -f network_security_previous || true

      # ==========================================
      # CLEAN UNUSED DOCKER IMAGES
      # ==========================================
      - name: Clean Unused Docker Images
        run: |
          docker image prune -f