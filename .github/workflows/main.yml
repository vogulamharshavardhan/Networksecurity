
name: NetworkSecurity CI-CD pipeline 

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Lint Code
        run: |
          echo "Linting repository"

      - name: Run Unit Tests
        run: |
          echo "Running unit tests"

  # ==========================================
  # 2. CONTINUOUS DELIVERY
  # ==========================================
  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Validate ECR Configuration
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          : "${ECR_REGISTRY:?ECR registry is empty}"
          : "${ECR_REPOSITORY:?ECR repository secret is missing}"
          : "${AWS_REGION:?AWS region is missing}"

          echo "ECR Registry: $ECR_REGISTRY"
          echo "ECR Repository: $ECR_REPOSITORY"

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${ECR_REGISTRY:?Registry is empty}"
          : "${ECR_REPOSITORY:?Repository is empty}"
          : "${IMAGE_TAG:?Image tag is empty}"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          LATEST_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "Building Docker image: $IMAGE_URI"

          docker build \
            -t "$IMAGE_URI" \
            -t "$LATEST_URI" .

          echo "Pushing versioned image..."
          docker push "$IMAGE_URI"

          echo "Pushing latest image..."
          docker push "$LATEST_URI"

          echo "Docker image successfully pushed to ECR."
          echo "Image URI: $IMAGE_URI"

  # ==========================================
  # 3. CONTINUOUS DEPLOYMENT
  # ==========================================
  Continuous-Deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: self-hosted

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate ECR Image URI
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${AWS_REGION:?AWS region is missing}"
          : "${ECR_REPOSITORY:?ECR repository is missing}"
          : "${IMAGE_TAG:?Image tag is missing}"

          echo "Retrieving ECR repository URI..."

          REPOSITORY_URI=$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' \
            --output text)

          : "${REPOSITORY_URI:?Could not retrieve ECR repository URI}"

          IMAGE="${REPOSITORY_URI}:${IMAGE_TAG}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "Generated deployment image:"
          echo "$IMAGE"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Pull Docker Image
        run: |
          set -euo pipefail

          echo "Pulling image: $IMAGE"

          docker pull "$IMAGE"

      - name: Stop Existing Container
        run: |
          docker rm -f network_security || true

      - name: Run New Docker Container
        run: |
          set -euo pipefail

          docker run -d \
            --restart unless-stopped \
            -p 8080:8080 \
            --ipc=host \
            --name network_security \
            "$IMAGE"

      - name: Verify Container
        run: |
          set -euo pipefail

          sleep 5

          if [ "$(docker inspect -f '{{.State.Running}}' network_security)" != "true" ]; then
            echo "Container failed to start"
            docker logs network_security
            exit 1
          fi

          echo "Container started successfully"

          docker ps --filter "name=network_security"

          docker logs --tail 50 network_security

      - name: Clean Unused Docker Images
        run: |
          docker image prune -f
